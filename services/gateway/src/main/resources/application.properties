spring.application.name=gateway
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
spring.cloud.gateway.server.webmvc.routes[0].id=ledger
spring.cloud.gateway.server.webmvc.routes[0].uri=${LEDGER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/transactions/**,/accounts/*/entries
spring.cloud.gateway.server.webmvc.routes[1].id=account
spring.cloud.gateway.server.webmvc.routes[1].uri=${ACCOUNT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/accounts/**
spring.cloud.gateway.server.webmvc.routes[2].id=settlement
spring.cloud.gateway.server.webmvc.routes[2].uri=${SETTLEMENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/settlements/**
spring.cloud.gateway.server.webmvc.routes[3].id=reconciliation
spring.cloud.gateway.server.webmvc.routes[3].uri=${RECONCILIATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/reconciliation/**
